version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: machineguard-backend
    ports:
      - "8000:8000"
    volumes:
      # Persists SQLite database locally on host
      - ./backend/machine_guard.db:/workspace/machine_guard.db
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: machineguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always
